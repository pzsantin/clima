<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="SRC/styles/styles.css">
    <title>Clima agora</title>
</head>
<body>
    <main id="container" class="spotlight-card">
        <form id="search">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            <input 
            type="search" 
            name="nome_da_cidade" 
            id="nome_da_cidade" 
            placeholder="Buscar cidade"
            autocomplete="off"
            list="localidades">

            <datalist id="localidades"></datalist>

            <button type="submit" aria-label="Buscar cidade">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            </button>
        </form>
        <div id="clima">
            <h1 id="title">Canoas, BR</h1>

            <div id="infos">
                <div id="temp">
                    <img id="temp_img" src="" alt="">

                    <div>
                        <p id="temp_value">
                            18°C
                        </p>
                        <p id="temp_description">
                            Nublado
                        </p>
                    </div>
                </div> 

                <div id="other_infos">
                    <div class="info">
                        <i id="temp_max_icon" class="fa-solid fa-temperature-high" aria-hidden="true"></i>

                        <div>
                            <h2>Temp. max</h2>

                            <p id="temp_max">28°C

                            </p>
                        </div>
                    </div>
                
                    <div class="info">
                        <i id="temp_min_icon" class="fa-solid fa-temperature-low" aria-hidden="true"></i>

                        <div>
                            <h2>Temp. min</h2>

                            <p id="temp_min">12°C

                            </p>
                        </div>
                    </div>

                    <div class="info">
                        <i id="humidity_icon" class="fa-solid fa-droplet" aria-hidden="true"></i>

                        <div>
                            <h2>Humidade</h2>

                            <p id="humidity">
                                50%
                            </p>
                        </div>
                    </div>

                    <div class="info">
                        <i id="wind_icon" class="fa-solid fa-wind" aria-hidden="true"></i>

                        <div>
                            <h2>Vento</h2>

                            <p id="wind">
                                20 km/h
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="alert"></div>
    </main>
    <script src="SRC/javascript/script.js"></script>  
</body>
</html>
